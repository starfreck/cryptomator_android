name: Build Mega APK

on:
  push:
    branches:
      - feature/mega-support
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build cryptomator_mega.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Playstore Debug APK
        run: ./gradlew assemblePlaystoreDebug --stacktrace

      - name: Copy & Rename APK
        run: cp presentation/build/outputs/apk/playstore/debug/presentation-playstore-debug.apk cryptomator_mega.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptomator_mega
          path: cryptomator_mega.apk
          retention-days: 30
